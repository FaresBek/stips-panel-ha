name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate distribution
        run: python tools/validate.py
      - name: Validate frontend syntax
        run: node --check custom_components/stips_panel/frontend/stips-panel-editor.js
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

